<svg xmlns="http://www.w3.org/2000/svg" width="600" height="40" viewBox="0 0 600 40" role="img" aria-label="Light separator: one small astrolabe ring settling home, centred and short">
  <line x1="120" y1="20" x2="262" y2="20" stroke="#33ff66" stroke-width="2"/>
  <line x1="338" y1="20" x2="480" y2="20" stroke="#33ff66" stroke-width="2"/>
  <g fill="none" stroke="#a8f0ff" stroke-width="2.5">
    <circle cx="300" cy="20" r="13">
      <animate attributeName="r" values="16;13" dur="2s" fill="freeze"/>
    </circle>
    <circle cx="300" cy="20" r="6.5" stroke="#ffb000">
      <animate attributeName="r" values="9;6.5" dur="2s" begin="0.3s" fill="freeze"/>
    </circle>
  </g>
  <circle cx="300" cy="20" r="2" fill="#8a919c"/>
</svg>
